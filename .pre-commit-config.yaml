# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Byte-exact test fixtures (generated by generate_ground_truth.py or
      # captured golden inputs) must not be whitespace-normalised, or the
      # committed bytes stop matching a fresh regeneration.
      - id: trailing-whitespace
        exclude: (^tests/data/golden_multiprocessing/)|(^tests/scientific_validation/.*\.msp$)
      - id: end-of-file-fixer
        exclude: (^tests/data/golden_multiprocessing/)|(^tests/scientific_validation/.*\.msp$)
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.1
    hooks:
      - id: mypy
        args: [--install-types, --non-interactive, --ignore-missing-imports]
        additional_dependencies: ["pydantic>=2.0"]
