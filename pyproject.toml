[project]
name = "massflow"
version = "0.7.0"
description = "A scientific Python package for mass spectrometry processing and analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matchms>=0.27.0",
    "ms2deepscore>=2.5.1",
    "numpy>=1.26.4",
    "packaging>=26.0",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "spec2vec>=0.8.0",
    "customtkinter>=5.2.2",
    "matplotlib>=3.8.3",
    "pillow>=10.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
massflow = "MassFlow.cli:main"
massflow-gui = "MassFlow.ui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/MassFlow"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
