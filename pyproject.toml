[project]
name = "massflow"
version = "1.0.0"
description = "A scientific Python package for mass spectrometry processing and analysis."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
    "click",
    "lxml",
    "matchms>=0.27.0",
    "numpy>=1.26.4",
    "packaging>=26.0",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "pyteomics",
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
ml = [
    "ms2deepscore>=2.5.1",
    "spec2vec>=0.8.0",
]
network = [
    "networkx>=3.2.1",
]
viz = [
    "networkx>=3.4.2",
    "pyvis>=0.3.2",
]

[project.scripts]
massflow = "MassFlow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/MassFlow"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "mkdocs<2.0",
    "mkdocs-material",
    "mkdocstrings",
    "mkdocstrings-python",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
markers = [
    "core: tests that must pass for the v1.0 stable release contract",
    "experimental: tests for experimental, post-1.0, or optional features",
]
