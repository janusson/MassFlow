[project]
name = "massflow"
version = "1.0.0"
description = "A scientific Python package for mass spectrometry processing and analysis."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
    "aider>=0.2.6",
    "click",
    "lxml",
    "matchms>=0.27.0",
    "numpy>=1.26.4",
    "packaging>=26.0",
    "polars>=0.20.0",
    "pydantic>=2.12.5",
    "pygls>=2.1.1",
    "pyteomics",
    "PyYAML",
    # rdkit moved to optional "chem" extra
    "rich>=15.0.0",
    "scikit-learn>=1.8.0",
    "typer>=0.25.1",
    "watchfiles>=1.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
chem = [
    "rdkit>=2025.9.6",
]
ml = [
    "ms2deepscore>=2.5.1",
    "spec2vec>=0.8.0",
]
network = [
    "networkx>=3.2.1",
]
viz = [
    "networkx>=3.4.2",
    "pyvis>=0.3.2",
]

[project.scripts]
massflow = "MassFlow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/MassFlow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "mkdocs<2.0",
    "mkdocs-material",
    "mkdocstrings",
    "mkdocstrings-python",
    "pytest-cov>=7.0.0",
    "pytest-benchmark",
    "memray",
    "mypy>=1.10",
    "ruff",
]

[tool.mypy]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
# Exclude experimental LSP server (stale pygls API) and root-level scratch scripts
exclude = ["src/MassFlow/server\\.py", "repro_isotope\\.py"]

[tool.pytest.ini_options]
markers = [
    "core: tests that must pass for the v1.0 stable release contract",
    "experimental: tests for experimental, post-1.0, or optional features",
]

[tool.coverage.run]
# The coverage gate measures the stable annotation-pipeline contract. The LSP
# editor-integration server is an experimental, optional feature (depends on
# pygls/lsprotocol, not part of the v1.0 contract, and already excluded from
# mypy), so it is omitted from the coverage denominator rather than held to the
# 80% threshold.
omit = ["src/MassFlow/server.py"]
