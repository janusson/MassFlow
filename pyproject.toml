[project]
name = "massflow"
version = "1.0.0"
description = "A scientific Python package for mass spectrometry processing and analysis."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
    "lxml",
    "matchms>=0.27.0",
    "numpy>=1.26.4",
    "packaging>=26.0",
    "polars>=0.20.0",
    "pydantic>=2.12.5",
    "pyteomics",
    "PyYAML",
    # rdkit moved to optional "chem" extra
    "rich>=15.0.0",
    "scikit-learn>=1.8.0",
    # Pinned for macOS 15 dyld compatibility with matchms transitive dep
    "scipy>=1.15.0",
    "typer>=0.25.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
chem = [
    "rdkit>=2025.9.6",
]
watch = [
    "watchfiles>=1.1.1",
]

[project.scripts]
massflow = "MassFlow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/MassFlow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "mkdocs<2.0",
    "mkdocs-material",
    "mkdocstrings",
    "mkdocstrings-python",
    "pytest-cov>=7.0.0",
    "pytest-benchmark",
    "memray",
    "mypy>=1.10",
    "ruff",
]

[tool.mypy]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
# Exclude root-level scratch scripts
exclude = ["repro_isotope\\.py"]

[tool.pytest.ini_options]
markers = [
    "core: tests that must pass for the v1.0 stable release contract",
]

[tool.coverage.run]
# The coverage gate measures the stable annotation-pipeline contract.
# All source modules are included in coverage measurement.
omit = []
