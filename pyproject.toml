[project]
name = "massflow"
version = "0.1.0"
description = "A scientific Python package for mass spectrometry processing and analysis."
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "grpcio>=1.60.0",
    "lxml",
    "matchms>=0.27.0",
    "numpy>=1.26.4",
    "packaging>=26.0",
    "polars>=0.20.0",
    "pydantic>=2.12.5",
    "pyteomics",
    "PyYAML",
    # rdkit moved to optional "chem" extra
    "rich>=15.0.0",
    "scikit-learn>=1.8.0",
    # Pinned for macOS 15 dyld compatibility with matchms transitive dep
    "scipy>=1.15.0",
    "typer>=0.25.1",
    "zarr>=3.2.1",
]

[project.optional-dependencies]
chem = [
    "rdkit>=2025.9.6",
]
ml = [
    "torch>=2.0.0",
    "gensim>=4.3.0",
    "spec2vec>=0.8.0",
    "ms2deepscore>=1.0.0",
]
hnsw = [
    "hnswlib>=0.8.0",
]
watch = [
    "watchfiles>=1.1.1",
]
tui = [
    "textual>=8.0.0",
]

[project.scripts]
massflow = "MassFlow.cli:main"

[project.entry-points."massflow.similarity_engines"]
spec2vec = "MassFlow.similarity:Spec2VecEngine"
ms2deepscore = "MassFlow.similarity:MS2DeepScoreEngine"
consensus = "MassFlow.similarity:ConsensusEngine"
cascade = "MassFlow.similarity:CascadeEngine"

[tool.hatch.build.targets.wheel]
packages = ["src/MassFlow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "grpcio-tools>=1.60.0",
    "pytest>=9.0.2",
    "pytest-asyncio",
    "mkdocs<2.0",
    "mkdocs-material",
    "mkdocstrings",
    "mkdocstrings-python",
    "pytest-cov>=7.0.0",
    "pytest-benchmark",
    "memray",
    "mypy>=1.10",
    "ruff",
]

[tool.mypy]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
# Exclude root-level scratch scripts
exclude = ["repro_isotope\\.py"]

[tool.ruff]
# Generated protobuf/gRPC stubs are not linted.
extend-exclude = [
    "src/MassFlow/streaming/generated",
    "src/MassFlow/generated",
]

[tool.pytest.ini_options]
# Explicit discovery: the release test suite lives under tests/ only.
# Scratch/experimental tests under scripts/experiments/ are NEVER collected.
testpaths = ["tests"]
# The default selection is the release suite: unit + integration +
# scientific-validation tests.  Benchmarks, slow tests, and
# optional-dependency tests run only when requested explicitly.
addopts = "-m 'not benchmark and not slow and not optional' --strict-markers"
# Explicit loop scope for async fixtures: pytest-asyncio >= 1.0 warns that
# the "fixture" caching-scope default will change to "function" in the
# future. All async fixtures in the suite are function-scoped, so pin the
# future default now.
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast, isolated unit tests (run by default)",
    "integration: cross-module integration tests (run by default)",
    "scientific: scientific-validation tests (run by default; CI runs them explicitly)",
    "benchmark: performance benchmarks (opt-in: -m benchmark)",
    "slow: long-running tests (opt-in: -m slow)",
    "optional: tests requiring optional dependency extras (opt-in: -m optional)",
]

[tool.coverage.run]
# The coverage gate measures the stable annotation-pipeline contract.
# All source modules are included in coverage measurement.
omit = []
