[project]
name = "massflow"
version = "1.0.0"
description = "A scientific Python package for mass spectrometry processing and analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2.2",
    "matchms>=0.27.0",
    "matplotlib>=3.7.2",
    "ms2deepscore>=2.5.1",
    "numpy>=1.26.4",
    "packaging>=26.0",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "spec2vec>=0.8.0",
]

[project.scripts]
massflow = "MassFlow.cli:main"
massflow-gui = "MassFlow.ui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/MassFlow"]
