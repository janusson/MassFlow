[project]
name = "massflow"
version = "0.1.0"
description = "A scientific Python package for mass spectrometry processing and analysis."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
    "grpcio>=1.60.0",
    "lxml",
    "matchms>=0.27.0",
    "numpy>=1.26.4",
    "packaging>=26.0",
    "polars>=0.20.0",
    "pydantic>=2.12.5",
    "pyteomics",
    "PyYAML",
    # rdkit moved to optional "chem" extra
    "rich>=15.0.0",
    "scikit-learn>=1.8.0",
    # Pinned for macOS 15 dyld compatibility with matchms transitive dep
    "scipy>=1.15.0",
    "typer>=0.25.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
chem = [
    "rdkit>=2025.9.6",
]
ml = [
    "torch>=2.0.0",
    "gensim>=4.3.0",
    "spec2vec>=0.8.0",
    "ms2deepscore>=1.0.0",
]
zarr = [
    "zarr>=3.0",
]
watch = [
    "watchfiles>=1.1.1",
]

[project.scripts]
massflow = "MassFlow.cli:main"

[project.entry-points."massflow.similarity_engines"]
spec2vec = "MassFlow.similarity:Spec2VecEngine"
ms2deepscore = "MassFlow.similarity:MS2DeepScoreEngine"
consensus = "MassFlow.similarity:ConsensusEngine"
cascade = "MassFlow.similarity:CascadeEngine"

[tool.hatch.build.targets.wheel]
packages = ["src/MassFlow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "grpcio-tools>=1.60.0",
    "pytest>=9.0.2",
    "pytest-asyncio",
    "mkdocs<2.0",
    "mkdocs-material",
    "mkdocstrings",
    "mkdocstrings-python",
    "pytest-cov>=7.0.0",
    "pytest-benchmark",
    "memray",
    "mypy>=1.10",
    "ruff",
]

[tool.mypy]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
# Exclude root-level scratch scripts
exclude = ["repro_isotope\\.py"]

[tool.pytest.ini_options]
addopts = "-m 'not benchmark'"
markers = [
    "core: tests that must pass for the v0.1 stable release contract",
    "benchmark: performance and latency benchmark tests (run with -m benchmark)",
]

[tool.coverage.run]
# The coverage gate measures the stable annotation-pipeline contract.
# All source modules are included in coverage measurement.
omit = []
