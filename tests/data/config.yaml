project:
  name: "Synthetic_Data_Test"
  output_directory: "data/results"

input:
  data_directory: "data/raw"
  reference_library: "data/reference/synthetic_library.msp"
  format: "mgf"

processing:
  min_peaks: 3
  min_intensity: 0.05
  normalize_intensity: true
  clean_metadata: true
  mz_min: 0.0
  mz_max: 2000.0
  noise_threshold: 0.05

similarity:
  algorithm: "modified_cosine"
  tolerance: 0.1
  min_score: 0.7
  min_matched_peaks: 3
