project:
  name: "MassFlow_Tutorial"
  output_directory: "tutorial/results"

input:
  input_path: "tutorial/tutorial_experimental.mgf"
  library_path: "tutorial/tutorial_library.msp"
  format: "mgf"

processing:
  clean_metadata: true
  normalize_intensity: true
  filter_min_peaks: true
  min_peaks: 3

similarity:
  algorithm: "cosine"
  ms1_tolerance: 0.02
  ms2_tolerance: 0.02
  tolerance_unit: "Da"
  min_score: 0.1
  fdr_threshold: 1.0

export:
  format: "csv"
