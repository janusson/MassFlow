name: Release

on:
  push:
    tags:
      - "v*.*.*"

# 1. THE FIX: Grant the workflow permission to write to the repo
permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Build sdist and wheel
        run: uv build

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # 2. THE FIX: Auto-generate notes instead of looking for a missing CHANGELOG.md
          generate_release_notes: true
