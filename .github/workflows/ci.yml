name: CI

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main, "release/*"]

permissions:
  contents: read

# The normal PR path verifies: formatting, linting, type checking, unit
# tests, core integration tests, and scientific-validation tests — all
# against the committed lockfile, on every supported Python/OS combination
# declared by the project (Python 3.13 on Linux and macOS).
# Benchmarks and slow tests never run in CI: they are opt-in only
# (`-m benchmark` / `-m slow`) and can never block an ordinary test run.

jobs:
  lockfile-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Lockfile is committed and in sync
        # CI must use the committed uv.lock: fail when it is missing or
        # out of date relative to pyproject.toml.
        run: uv lock --check
      - name: Formatting (ruff format --check)
        run: uv run ruff format --check .
      - name: Linting (ruff check)
        run: uv run ruff check .
      - name: Type checking (mypy)
        run: uv run mypy .

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install core deps from lockfile
        run: uv sync --frozen
      - name: Run quickstart (smoke)
        run: uv run massflow annotate --config tutorial/tutorial_config.yaml

  installed-wheel-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Build wheel
        run: uv build
      - name: Install wheel without extras
        run: |
          uv venv --python 3.13 /tmp/massflow-core
          uv pip install --python /tmp/massflow-core/bin/python dist/*.whl
      - name: Assert installed dependency contract
        run: |
          /tmp/massflow-core/bin/python - <<'PY'
          from importlib.metadata import metadata, requires, version

          import rdkit
          from MassFlow.cheminformatics import _HAS_RDKIT

          massflow_requires = metadata("massflow-msms").get_all("Requires-Dist") or []
          core_requires = [item for item in massflow_requires if "extra ==" not in item]
          if any(item.lower().startswith("rdkit") for item in core_requires):
              raise SystemExit("unexpected direct core RDKit requirement")
          if not any(item.lower().startswith("matchms") for item in core_requires):
              raise SystemExit("matchms must remain a core requirement")
          matchms_requires = requires("matchms") or []
          if not any("rdkit" in item.lower() for item in matchms_requires):
              raise SystemExit("expected matchms to require rdkit transitively")
          if not _HAS_RDKIT:
              raise SystemExit("expected RDKit to import in the supported core installation")
          print("MassFlow", version("massflow-msms"))
          print("RDKit", version("rdkit"))
          print(
              "matchms RDKit requirement",
              [item for item in matchms_requires if "rdkit" in item.lower()],
          )

          # The wheel ships generated gRPC/protobuf modules; importing them must
          # work in a clean no-extra core installation.
          import MassFlow.generated
          import MassFlow.streaming
          import MassFlow.streaming.generated.massflow.v1.streaming_pb2 as streaming_pb2

          print("streaming protobuf package resources OK", streaming_pb2.__name__)
          PY
      - name: Installed CLI smoke
        run: |
          /tmp/massflow-core/bin/massflow --help
          /tmp/massflow-core/bin/massflow init --output /tmp/massflow-core-config.yaml
          test -s /tmp/massflow-core-config.yaml

  test:
    needs: [lockfile-and-lint, smoke]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.13"]
    runs-on: ${{ matrix.os }}
    # A hung test previously burned GitHub's 360-minute default job timeout.
    # Fail fast instead, and dump thread stacks (faulthandler) so the culprit
    # is visible in the log rather than the job simply timing out.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies from lockfile
        run: uv sync --all-extras --frozen

      - name: Release suite — unit + core integration tests (with coverage)
        # The default selection: everything except benchmark/slow/optional.
        # faulthandler dumps all thread stacks if a single test stalls, so a
        # hang is diagnosable from the log instead of silently timing out.
        env:
          PYTHONFAULTHANDLER: "1"
        run: uv run pytest --cov=src/MassFlow --cov-report=xml --cov-fail-under=80 -o faulthandler_timeout=600 -v

      - name: Scientific-validation tests (explicit group)
        run: uv run pytest -m scientific -v

      - name: Optional-dependency tests (explicit group)
        run: uv run pytest -m optional -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
