project:
  name: "MassFlow_Annotation_Test"
  # Results will be saved in a subfolder named by the run
  output_directory: "results/test_run"

input:
  # Automatically detects mzML, mzXML, MSP, MGF, etc.
  input_path: "../MassFlow_Data/experiments/example_spectrum.MSP"
  library_path: "../MassFlow_Data/libraries/ALL_GNPS.msp"
  format: null

processing: # basic cleaning only
  clean_metadata: true
  normalize_intensity: true
  reduce_to_top_n_peaks: true
  n_max: 100

similarity:
  algorithm: "cosine"
  ms1_tolerance: 0.02
  ms2_tolerance: 0.02
  min_score: 0.7
  fdr_threshold: 0.05

export:
  # Simplified output for spreadsheet analysis
  # Available formats: "csv", "mztab", "fbmn", "json", "parquet", "xlsx"
  # Use "fbmn" to generate GNPS-compatible paired files (CSV feature table + Consensus MGF)
  format: "csv"
