project:
  name: "MassFlow_Annotation_Test"
  # Results will be saved in a subfolder named by the run
  output_directory: "results/test_run"

input:
  # Automatically detects mzML, mzXML, MSP, MGF, etc.
  input_path: "../MassFlow_Data/experiments/example_spectrum.MSP"
  library_path: "../MassFlow_Data/libraries/ALL_GNPS.msp"
  format: null

processing: # basic cleaning only
  clean_metadata: true
  normalize_intensity: true
  reduce_to_top_n_peaks: true
  n_max: 100
  # Entropy-based decoy generation for FDR calibration:
  # peaks below this fraction of the BASE PEAK are treated as baseline
  # noise and excluded before the sqrt-weighted spectral entropy is
  # computed.
  decoy_min_relative_intensity: 0.01
  # per-peak m/z jitter (Da) randomizing decoy fragmentation pathways.
  decoy_mz_shift_da: 1.0

similarity:
  algorithm: "cosine"
  ms1_tolerance: 0.02
  ms2_tolerance: 0.02
  min_score: 0.7
  fdr_threshold: 0.05
  # Numba peak/neutral-loss prefilter for modified_cosine candidate
  # generation (identical results, faster on large libraries):
  enable_numba_prefilter: true
  # HNSW approximate candidate retrieval inside the cascade engine.
  # Requires the [hnsw] extra. Tune M/ef_construction/ef_search for
  # recall because spectral similarity is non-metric.
  hnsw_enabled: false
  hnsw_m: 32
  hnsw_ef_construction: 400
  hnsw_ef_search: 200
  hnsw_candidates_per_query: 200

export:
  # Available formats: "csv", "mztab"
  format: "csv"
