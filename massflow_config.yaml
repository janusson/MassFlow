project:
  name: "MassFlow_Annotation"
  # Results will be saved in a subfolder named by the run
  output_directory: "results/annotation_report"

input:
  # Automatically detects mzML, mzXML, MSP, MGF, etc.
  input_path: "../MassFlow_Data/experiments/"
  library_path: "../MassFlow_Data/libraries/example_library.msp"
  format: null

processing:
  # Optimized for speed: basic cleaning only
  clean_metadata: true
  normalize_intensity: true
  # Optional: Uncomment for faster processing of complex spectra
  # reduce_to_top_n_peaks: true
  # n_max: 100

similarity:
  # Fast, standard cosine search
  algorithm: "cosine"
  ms1_tolerance: 0.02
  ms2_tolerance: 0.02
  min_score: 0.7
  fdr_threshold: 0.05

export:
  # Simplified output for spreadsheet analysis
  # Available formats: "csv", "mztab", "fbmn", "json", "parquet", "xlsx"
  # Use "fbmn" to generate GNPS-compatible paired files (CSV feature table + Consensus MGF)
  format: "csv"
