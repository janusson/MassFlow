project:
  name: "Standard_Annotation_Workflow"
  output_directory: "results/standard_analysis"

input:
  # Canonical bundled example data
  file_path: "data/experiments/COE001_16ppm_5uL.mzML"
  library_path: "data/libraries/example_library.msp"
  format: "mzml"

processing:
  # ------------------------------------------------------------------
  # METADATA PROCESSING
  # These toggles map to matchms metadata filters in processing.py.
  # ------------------------------------------------------------------
  clean_metadata: true
  add_retention_time: true
  repair_inchi_inchikey_smiles: true
  derive_adduct_from_name: true
  derive_formula_from_name: true
  clean_compound_name: true
  derive_ionmode: true
  make_charge_int: true

  # ------------------------------------------------------------------
  # PEAK PROCESSING
  # These settings are applied to both query and reference spectra.
  # ------------------------------------------------------------------
  filter_by_intensity: true
  noise_threshold: 1000.0
  min_intensity: 0.0

  filter_min_peaks: true
  min_peaks: 5

  filter_by_mz: true
  mz_min: 0.0
  mz_max: 1000.0

  reduce_to_top_n_peaks: true
  n_max: 100

  normalize_intensity: true

similarity:
  # ------------------------------------------------------------------
  # CORE SEARCH SETTINGS
  # For the current stable workflow, start with "cosine" or
  # "modified_cosine". More advanced engines are experimental.
  # ------------------------------------------------------------------
  algorithm: "cosine"
  ms1_tolerance: 10.0
  tolerance: 0.02
  tolerance_unit: "Da"
  min_score: 0.6
  min_matched_peaks: 3
  fdr_threshold: 0.05

workflow:
  # Only perform_networking is consumed directly by the current
  # annotation workflow. Keep the other fields out of the canonical
  # example until they are part of the stable contract.
  perform_networking: false

export:
  # The current annotation workflow writes CSV result tables.
  format: "csv"
